name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          fi

      # A release is published when a v* tag is pushed, or when a push to main
      # (or a manual run) carries a VERSION_NAME that has no release yet.
      - name: Decide whether to publish a release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.name }}
        run: |
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || { [[ "$GITHUB_EVENT_NAME" == "push" ]] && [[ "$GITHUB_REF" == "refs/heads/main" ]]; }; then
            if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release v$V already exists; building only."
            else
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Publish release v$V: $publish"

      # Preferred: sign with the shop's permanent key stored in repository secrets, so every
      # release installs over the previous one as an update.
      # Fallback: if no secrets are set yet, generate a throw-away key so the APK is still
      # installable. Phones will then require an uninstall before installing a later build
      # until the permanent key is configured.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS:-chocolaterabbit}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "Signing with the repository's release key."
          else
            echo "::warning::No KEYSTORE_BASE64 secret set. Signing with a temporary key; see README to set up the permanent key so updates install in place."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/temp.jks" -storepass temp-password \
              -alias chocolaterabbit -keypass temp-password -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=The Chocolate Rabbit, O=The Chocolate Rabbit, C=CA" >/dev/null 2>&1
            echo "KEYSTORE_PATH=$RUNNER_TEMP/temp.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=temp-password" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=chocolaterabbit" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=temp-password" >> "$GITHUB_ENV"
          fi

      # The 176 MB segmentation model is too large for git, so the build fetches it and
      # bundles it into the APK. Pinned by SHA-256 so a changed upstream file fails the build.
      - name: Fetch segmentation model
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          curl -sSL --retry 3 -o app/src/main/assets/models/isnet-general-use.onnx \
            https://github.com/danielgatis/rembg/releases/download/v0.0.0/isnet-general-use.onnx
          echo "60920e99c45464f2ba57bee2ad08c919a52bbf852739e96947fbb4358c0d964a  app/src/main/assets/models/isnet-general-use.onnx" | sha256sum -c -

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease -PVERSION_NAME="${{ steps.ver.outputs.name }}"

      - name: Collect APK
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          OUT="Chocolate-Rabbit-Product-Photos-${{ steps.ver.outputs.name }}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$OUT")" >> "$GITHUB_OUTPUT"
          echo "Built $OUT ($(stat -c%s "$OUT") bytes)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}

      - name: Extract changelog for this version
        if: steps.rel.outputs.publish == 'true'
        run: |
          V="${{ steps.ver.outputs.name }}"
          awk -v v="$V" '
            /^## / { if (found) exit; if (index($0, "v" v) > 0) { found=1; next } }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then echo "Release v$V" > RELEASE_NOTES.md; fi
          {
            echo
            echo "---"
            echo "**Install:** download the \`.apk\` below on the phone, open it, and allow installs from this source when asked."
            echo
            echo "SHA-256: \`${{ steps.apk.outputs.sha256 }}\`"
          } >> RELEASE_NOTES.md
          echo "---- release notes ----"; cat RELEASE_NOTES.md

      - name: Publish GitHub release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Chocolate Rabbit Product Photos ${{ steps.ver.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

      # The in-app updater reads release/update.json from main, so publish the
      # feed only after the release and its APK asset exist.
      - name: Update release feed on main
        if: steps.rel.outputs.publish == 'true'
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          ASSET: ${{ steps.apk.outputs.path }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          SIZE: ${{ steps.apk.outputs.size }}
        run: |
          set -euo pipefail
          IFS=. read -r MAJ MIN PAT <<< "$VERSION_NAME"
          CODE=$(( ${MAJ%%[^0-9]*} * 10000 + ${MIN%%[^0-9]*} * 100 + ${PAT%%[^0-9]*} ))
          git fetch origin main
          git checkout -B main origin/main
          CURRENT=$(python3 -c "import json;print(json.load(open('release/update.json'))['versionCode'])")
          if [ "$CODE" -le "$CURRENT" ]; then
            echo "::error::versionCode $CODE is not newer than the feed's $CURRENT; not updating release/update.json."
            exit 1
          fi
          cat > release/update.json <<JSON
          {
            "schemaVersion": 1,
            "packageName": "com.chocolaterabbit.productphotos",
            "versionName": "$VERSION_NAME",
            "versionCode": $CODE,
            "apk": {
              "assetName": "$ASSET",
              "sha256": "$SHA256",
              "sizeBytes": $SIZE
            }
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/update.json
          git commit -m "Publish Chocolate Rabbit Product Photos $VERSION_NAME update feed"
          git push origin main
